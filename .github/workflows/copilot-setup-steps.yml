jobs:
  copilot-setup-steps:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn -B dependency:go-offline
      - run: mvn -B test
      - run: git config core.hooksPath .githooks