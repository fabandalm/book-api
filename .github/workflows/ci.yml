name: Build, test, and run

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Build package
        run: mvn -B package -DskipTests

      - name: Run application smoke test
        shell: bash
        run: |
          mvn -B spring-boot:run > /tmp/book-api.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/books > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/book-api.log
          exit 1